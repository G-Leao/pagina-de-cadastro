<!doctype html>
<html lang="PT-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>trabalho de cadastro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header>
      <div class="contacts">
        <nav>
          <a
            href="https://github.com/G-Leao"
            target="_blank"
            aria-label="GitHub"
          >
            <i class="fa-brands fa-github"></i>
          </a>
          <a
            href="https://www.linkedin.com/in/gustavoleaoDEV/"
            target="_blank"
            aria-label="LinkedIn"
          >
            <i class="fa-brands fa-linkedin"></i>
          </a>
          <a
            href="https://www.instagram.com/g.leao.03/"
            target="_blank"
            aria-label="Instagram"
          >
            <i class="fa-brands fa-instagram"></i>
          </a>
        </nav>
      </div>
    </header>
    <main>
      <div class="container">
        <div class="form">
          <h1>CADASTRO</h1>
          <input type="text" id="nome" placeholder="Digite seu nome completo" />
          <input type="email" id="dados" placeholder="Digite seu e-mail" />
          <input type="number" id="idade" placeholder="Digite sua idade" />
          <input type="password" id="senha" placeholder="Digite uma senha" />
          <input type="password" id="senha2" placeholder="Confirme a senha" />

          <div class="buttons">
            <button id="btnCadastro">Cadastrar</button>
            <button type="button" id="btnLimpar">Limpar</button>
            <button type="button" id="btnCancelar" style="display: none">
              Cancelar edição
            </button>
          </div>
        </div>

        <div class="usuarios">
          <h2>Usuários cadastrados</h2>
          <ul id="listaUsuarios"></ul>
        </div>
      </div>
    </main>

    <script src="index.js"></script>
  </body>
</html>
